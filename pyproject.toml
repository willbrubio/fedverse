[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedlib"
version = "0.1.0"
description = "FED3 multi-assay analysis pipeline (SSPsyGene)"
requires-python = ">=3.10"
# Runtime deps your extracted/own code actually imports.
dependencies = [
    "pandas<3",
    "numpy",
    "matplotlib",
    "scipy",
    "seaborn",
    "statsmodels",
    "pingouin",
    "tqdm",
    "ipywidgets",
    "openpyxl",
]

# Tells setuptools the packages live under src/ (the src-layout).
# It will discover fedlib and fedlib.extracted automatically.
[tool.setuptools.packages.find]
where = ["src"]

# Bundle images into the wheel. Key must match the IMPORT package
# (the folder under src/), which is now "fedlib".
[tool.setuptools.package-data]
"fedlib.fedassets" = ["*.png", "*.svg", "*.jpg"]
